<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CineNova Elite</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --primary: #6366f1;
  --success: #10b981;
  --danger: #f43f5e;
  --bg: #0b0f1a;
  --glass: rgba(30, 41, 59, 0.7);
  --glass-border: rgba(255, 255, 255, 0.1);
  --text: #ffffff;
  --text-dim: #94a3b8;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: radial-gradient(circle at top right, #1e1b4b, #0b0f1a);
  color: var(--text);
  margin: 0;
  padding: 20px 16px 100px;
  min-height: 100vh;
}

/* Header & Stats */
.app-header { margin-bottom: 30px; }
.app-header h1 { font-weight: 800; font-size: 28px; margin: 0; letter-spacing: -1px; }
.app-header p { color: var(--text-dim); margin: 5px 0 0; font-size: 14px; }

/* Filter Section - Glassmorphism */
.filter-shelf {
  background: var(--glass);
  backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 12px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 25px;
  position: sticky;
  top: 10px;
  z-index: 100;
}

select {
  background: rgba(0,0,0,0.2);
  border: 1px solid var(--glass-border);
  color: white;
  padding: 10px;
  border-radius: 12px;
  font-size: 13px;
  outline: none;
}

/* Add Item Form (Collapsible/Modal-like) */
#addForm {
  background: var(--glass);
  backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 20px;
  margin-bottom: 30px;
  border: 1px solid var(--glass-border);
  display: none; /* Toggled by FAB */
}

input, textarea {
  width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
  color: white; padding: 14px; border-radius: 14px; margin-bottom: 10px; font-size: 15px;
}

/* Floating Action Button */
.fab {
  position: fixed; bottom: 30px; right: 20px;
  width: 60px; height: 60px; border-radius: 30px;
  background: var(--primary); color: white;
  font-size: 30px; border: none; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4);
  z-index: 1000; cursor: pointer;
}

/* Media Cards */
.section-title { font-size: 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin: 25px 0 15px 5px; }

.card {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 15px;
  display: flex;
  align-items: center;
  gap: 15px;
  position: relative;
  transition: 0.3s;
}

.checkbox-custom {
  width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--primary);
  display: flex; align-items: center; justify-content: center;
}

.card-body { flex: 1; }
.card-body h3 { margin: 0; font-size: 17px; font-weight: 600; }
.meta-row { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.badge { background: rgba(255,255,255,0.1); padding: 3px 8px; border-radius: 6px; font-size: 11px; color: var(--text-dim); }
.rating-pill { background: #fbbf24; color: #000; font-weight: 800; }

/* Kebab Menu (3 Dots) */
.options-btn {
  background: none; border: none; color: var(--text-dim);
  font-size: 20px; padding: 10px; cursor: pointer;
}

.menu-dropdown {
  position: absolute; right: 10px; top: 45px;
  background: #1e293b; border: 1px solid var(--glass-border);
  border-radius: 12px; width: 150px; display: none; z-index: 50;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

.menu-item {
  padding: 12px 15px; font-size: 14px; border-bottom: 1px solid var(--glass-border);
  display: flex; align-items: center; gap: 10px;
}
.menu-item:last-child { border: none; color: var(--danger); }

/* Multi-select bar */
.selection-bar {
  position: fixed; top: 0; left: 0; width: 100%; height: 60px;
  background: var(--primary); display: none; align-items: center;
  justify-content: space-between; padding: 0 20px; z-index: 2000;
}
</style>
</head>
<body>

<div class="selection-bar" id="selectionBar">
  <span id="selectCount">0 selected</span>
  <button onclick="deleteBulk()" style="background:white; color:var(--danger); border:none; padding:8px 15px; border-radius:10px; font-weight:bold;">Delete</button>
</div>

<div class="app-header">
  <h1>CineNova</h1>
  <p id="statsText">You've tracked 0 items</p>
</div>

<div id="addForm">
  <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
    <h2 style="margin:0; font-size:18px;">New Entry</h2>
    <button onclick="toggleForm()" style="background:none; border:none; color:white; font-size:20px;">✕</button>
  </div>
  <input id="title" placeholder="Title">
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
    <select id="type">
      <option>Movie</option><option>Series</option><option>Book</option>
    </select>
    <select id="genre">
      <option value="">Genre</option>
      <option>Action</option><option>Drama</option><option>Comedy</option><option>Romance</option><option>Thriller</option><option>Sci-Fi</option><option>Horror</option><option>Mystery</option><option>Superhero</option><option>Spy</option><option>FamilyDrama</option><option>Fantasy</option><option>Animation</option><option>Cartoon</option><option>Documentary</option><option>Biography</option><option>Travel</option><option>Musical</option><option>Crime</option><option>RealityShow</option><option>GameShow</option><option>TalkShow</option>
    </select>
  </div>
  <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
    <input id="rating" type="number" placeholder="Rating (1-10)">
    <input id="date" type="date">
  </div>
  <textarea id="notes" placeholder="How was it?"></textarea>
  <div style="display:flex; gap:10px;">
    <button class="fab" style="position:static; width:100%; border-radius:14px; height:50px; font-size:16px;" onclick="addItem('watched')">Add to Watched</button>
    <button class="fab" style="position:static; width:100%; border-radius:14px; height:50px; font-size:16px; background:var(--success);" onclick="addItem('wishlist')">Wishlist</button>
  </div>
</div>

<div class="filter-shelf">
  <select id="fType" onchange="render()"><option value="all">Types</option><option>Movie</option><option>Series</option><option>Book</option></select>
  <select id="fGenre" onchange="render()"><option value="all">Genres</option>
  <option>Action</option><option>Drama</option><option>Comedy</option><option>Romance</option><option>Thriller</option><option>Sci-Fi</option><option>Horror</option><option>Mystery</option><option>Superhero</option><option>Spy</option><option>FamilyDrama</option><option>Fantasy</option><option>Animation</option><option>Cartoon</option><option>Documentary</option><option>Biography</option><option>Travel</option><option>Musical</option><option>Crime</option><option>RealityShow</option><option>GameShow</option><option>TalkShow</option>
  </select>
  <select id="fSort" onchange="render()"><option value="newest">Newest</option><option value="alpha">A-Z</option><option value="rating">Rating</option></select>
  <button onclick="clearFilters()" style="background:none; border:1px solid var(--glass-border); color:white; border-radius:12px;">Reset</button>
</div>

<div class="section-title">Watched</div>
<div id="watchedList"></div>

<div class="section-title">Wishlist</div>
<div id="wishlistList"></div>

<button class="fab" onclick="toggleForm()">+</button>

<script>
let data = {
  watched: JSON.parse(localStorage.getItem("cine_v3_w")) || [],
  wishlist: JSON.parse(localStorage.getItem("cine_v3_l")) || []
};

function toggleForm() {
  const f = document.getElementById('addForm');
  f.style.display = f.style.display === 'block' ? 'none' : 'block';
  window.scrollTo(0,0);
}

function save() {
  localStorage.setItem("cine_v3_w", JSON.stringify(data.watched));
  localStorage.setItem("cine_v3_l", JSON.stringify(data.wishlist));
}

function addItem(list) {
  const title = document.getElementById('title').value;
  if(!title) return;
  const item = {
    id: Date.now(), title,
    type: document.getElementById('type').value,
    genre: document.getElementById('genre').value || 'Other',
    rating: document.getElementById('rating').value || 0,
    date: document.getElementById('date').value || new Date().toISOString().split('T')[0],
    notes: document.getElementById('notes').value
  };
  data[list].unshift(item);
  save(); render(); toggleForm();
}

function toggleMenu(id) {
  const menus = document.querySelectorAll('.menu-dropdown');
  menus.forEach(m => { if(m.id !== 'm'+id) m.style.display = 'none'; });
  const el = document.getElementById('m'+id);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}

function deleteSingle(list, id) {
  data[list] = data[list].filter(i => i.id !== id);
  save(); render();
}

function moveToWatched(id) {
  const idx = data.wishlist.findIndex(i => i.id === id);
  const item = data.wishlist.splice(idx, 1)[0];
  data.watched.unshift(item);
  save(); render();
}

function updateSelection() {
  const checked = document.querySelectorAll('.card-check:checked').length;
  const bar = document.getElementById('selectionBar');
  bar.style.display = checked > 0 ? 'flex' : 'none';
  document.getElementById('selectCount').innerText = `${checked} selected`;
}

function deleteBulk() {
  const checked = document.querySelectorAll('.card-check:checked');
  if(confirm(`Delete ${checked.length} items?`)) {
    checked.forEach(cb => {
      const id = parseInt(cb.value);
      data.watched = data.watched.filter(i => i.id !== id);
      data.wishlist = data.wishlist.filter(i => i.id !== id);
    });
    save(); render(); updateSelection();
  }
}

function clearFilters() {
  document.getElementById('fType').value = 'all';
  document.getElementById('fGenre').value = 'all';
  render();
}

function render() {
  const fType = document.getElementById('fType').value;
  const fGenre = document.getElementById('fGenre').value;
  const fSort = document.getElementById('fSort').value;

  ['watched', 'wishlist'].forEach(listName => {
    const container = document.getElementById(`${listName}List`);
    container.innerHTML = "";
    
    let filtered = data[listName].filter(i => {
      return (fType === 'all' || i.type === fType) && (fGenre === 'all' || i.genre === fGenre);
    });

    filtered.sort((a,b) => {
      if(fSort === 'alpha') return a.title.localeCompare(b.title);
      if(fSort === 'rating') return b.rating - a.rating;
      return new Date(b.date) - new Date(a.date);
    });

    filtered.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <input type="checkbox" class="card-check" value="${item.id}" onchange="updateSelection()" style="width:20px; height:20px; accent-color:var(--primary);">
        <div class="card-body">
          <h3>${item.title}</h3>
          <div class="meta-row">
            <span class="badge">${item.type}</span>
            <span class="badge">${item.genre}</span>
            ${item.rating > 0 ? `<span class="badge rating-pill">★ ${item.rating}</span>` : ''}
          </div>
        </div>
        <button class="options-btn" onclick="toggleMenu(${item.id})">⋮</button>
        <div class="menu-dropdown" id="m${item.id}">
          ${listName === 'wishlist' ? `<div class="menu-item" onclick="moveToWatched(${item.id})">✅ Move to Watched</div>` : ''}
          <div class="menu-item" onclick="deleteSingle('${listName}', ${item.id})">🗑️ Delete</div>
        </div>
      `;
      container.appendChild(card);
    });
  });
  
  document.getElementById('statsText').innerText = `You've tracked ${data.watched.length + data.wishlist.length} titles`;
}

// Close menus when clicking outside
document.addEventListener('click', (e) => {
  if (!e.target.classList.contains('options-btn')) {
    document.querySelectorAll('.menu-dropdown').forEach(m => m.style.display = 'none');
  }
});

render();
</script>
</body>
</html>

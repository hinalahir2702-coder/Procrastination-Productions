<!DOCTYPE html>
<html>
<head>
<title>CineNova Tracker - Mobile App Dark UI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  font-family: "Helvetica Neue", Arial, sans-serif;
  background: #121212;
  color: #f0f0f0;
  margin: 0;
  padding: 0;
}
.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}
h2 {
  margin-top: 25px;
  font-size: 24px;
  font-weight: 700;
  color: #ffffff;
}

/* Inputs and selects */
input, select, textarea {
  width: 100%;
  font-size: 16px;
  padding: 14px;
  margin: 10px 0;
  border-radius: 12px;
  border: none;
  background: #1e1e1e;
  color: #f0f0f0;
}
input:focus, select:focus, textarea:focus {
  outline: 2px solid #3b82f6;
}

/* Buttons */
button {
  font-size: 16px;
  font-weight: 600;
  border-radius: 12px;
  border: none;
  cursor: pointer;
  transition: 0.2s;
}
button:hover { opacity: 0.85; }
.primary { background: #3b82f6; color: #fff; width: 48%; margin-right:4%; }
.success { background: #10b981; color: #fff; width: 48%; margin-left:4%; }
.danger  { background: #ef4444; color: #fff; }
.secondary { background: #64748b; color: #fff; }

/* Filter & Delete selected buttons */
.filter-box select, .filter-box button {
  margin: 5px 0;
  padding: 10px;
  border-radius: 12px;
  border: none;
  font-size: 15px;
}
.filter-box button { width: 48%; margin-right:4%; }

/* Cards */
.card {
  position: relative;
  background: #1e1e1e;
  padding: 15px 15px 15px 50px;
  margin: 15px 0;
  border-radius: 16px;
  box-shadow: 0 6px 12px rgba(0,0,0,0.5);
  font-size: 16px;
  display: flex;
  align-items: flex-start;
}
.card-content { flex: 1; }
.card input[type="checkbox"] {
  position: absolute;
  left: 15px;
  top: 20px;
  transform: scale(1.5);
}
.card .delete-btn {
  position: absolute;
  top: 10px;
  right: 10px;
  background: #ef4444;
  color: white;
  border-radius: 50%;
  width: 28px;
  height: 28px;
  font-size: 18px;
  padding: 0;
  border: none;
  cursor: pointer;
}
.card .move-btn {
  background: #10b981;
  color: white;
  font-size: 14px;
  padding: 4px 8px;
  border-radius: 10px;
  margin-left: 5px;
}

/* Responsive adjustments */
@media (max-width: 480px) {
  h2 { font-size: 20px; }
  input, select, textarea, button { font-size: 16px; padding: 12px; }
  .card { font-size: 16px; padding: 18px 18px 18px 50px; }
}
</style>
</head>
<body>
<div class="container">

<h2>Add Media</h2>
<input id="title" placeholder="Title">
<select id="type">
  <option>Movie</option>
  <option>Series</option>
  <option>Book</option>
</select>
<select id="genre">
  <option value="">Select Genre</option>
  <option>Action</option>
  <option>Drama</option>
  <option>Comedy</option>
  <option>Romance</option>
  <option>Thriller</option>
  <option>Sci-Fi</option>
  <option>Horror</option>
  <option>Mystery</option>
  <option>Superhero</option>
  <option>Spy</option>
  <option>FamilyDrama</option>
  <option>Fantasy</option>
  <option>Animation</option>
  <option>Cartoon</option>
  <option>Documentary</option>
  <option>Biography</option>
  <option>Travel</option>
  <option>Musical</option>
  <option>Crime</option>
  <option>RealityShow</option>
  <option>GameShow</option>
  <option>TalkShow</option>
</select>
<input id="rating" type="number" placeholder="Rating (1-10)">
<input id="date" type="date">
<textarea id="notes" placeholder="Notes"></textarea>

<button class="primary" onclick="addWatched()">Add Watched</button>
<button class="success" onclick="addWishlist()">Add Wishlist</button>

<div class="filter-box">
<h2>Filters</h2>
<select onchange="setTimeFilter(this.value)">
  <option value="">All Time</option>
  <option value="thisYear">This Year</option>
  <option value="lastMonth">Last Month</option>
</select>
<select onchange="setGenreFilter(this.value)">
  <option value="all">All Genres</option>
  <option>Action</option>
  <option>Drama</option>
  <option>Comedy</option>
  <option>Romance</option>
  <option>Thriller</option>
  <option>Sci-Fi</option>
  <option>Horror</option>
  <option>Mystery</option>
  <option>Superhero</option>
  <option>Spy</option>
  <option>FamilyDrama</option>
  <option>Fantasy</option>
  <option>Animation</option>
  <option>Cartoon</option>
  <option>Documentary</option>
  <option>Biography</option>
  <option>Travel</option>
  <option>Musical</option>
  <option>Crime</option>
  <option>RealityShow</option>
  <option>GameShow</option>
  <option>TalkShow</option>
</select>
<select onchange="setTypeFilter(this.value)">
  <option value="all">All Types</option>
  <option>Movie</option>
  <option>Series</option>
  <option>Book</option>
</select>
<button class="secondary" onclick="sortWatched('date')">Sort</button>
</div>

<button class="danger" onclick="deleteSelected('watched')">Delete Selected Watched</button>
<button class="danger" onclick="deleteSelected('wishlist')">Delete Selected Wishlist</button>

<h2>Watched</h2>
<div id="watchedList"></div>

<h2>Wishlist</h2>
<div id="wishlistList"></div>

<script>
// Data
let watched = JSON.parse(localStorage.getItem("watched")) || [];
let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
let timeFilter="", genreFilter="", typeFilter="";

function save() { localStorage.setItem("watched", JSON.stringify(watched)); localStorage.setItem("wishlist", JSON.stringify(wishlist)); }
function getFormData(){ return { title: title.value, type: type.value, genre: genre.value, rating: rating.value, date: date.value, notes: notes.value }; }
function clearForm(){ title.value=""; genre.value=""; rating.value=""; date.value=""; notes.value=""; }
function addWatched(){ watched.push(getFormData()); save(); render(); clearForm(); }
function addWishlist(){ wishlist.push(getFormData()); save(); render(); clearForm(); }
function deleteWatched(i){ if(confirm("Delete this item?")){ watched.splice(i,1); save(); render(); } }
function deleteWishlist(i){ if(confirm("Delete this item?")){ wishlist.splice(i,1); save(); render(); } }
function moveToWatched(i){ if(confirm("Move to Watched?")){ watched.push(wishlist[i]); wishlist.splice(i,1); save(); render(); } }
function setTimeFilter(v){ timeFilter=v; render(); }
function setGenreFilter(v){ genreFilter=v.toLowerCase(); render(); }
function setTypeFilter(v){ typeFilter=v.toLowerCase(); render(); }
function sortWatched(type){ if(type==="date") watched.sort((a,b)=>new Date(b.date)-new Date(a.date)); if(type==="rating") watched.sort((a,b)=>b.rating-a.rating); if(type==="alpha") watched.sort((a,b)=>a.title.localeCompare(b.title)); if(type==="genre") watched.sort((a,b)=>a.genre.localeCompare(b.genre)); if(type==="type") watched.sort((a,b)=>a.type.localeCompare(b.type)); render(); }

function deleteSelected(listType){
  let items = listType==="watched"?watched:wishlist;
  let checkboxes = document.querySelectorAll(`#${listType}List input[type="checkbox"]:checked`);
  if(checkboxes.length===0){ alert("Select at least one item."); return; }
  if(confirm("Delete selected items?")){
    let indexes = Array.from(checkboxes).map(cb=>parseInt(cb.dataset.index)).sort((a,b)=>b-a);
    indexes.forEach(i=>items.splice(i,1));
    save(); render();
  }
}

function render(){
  const watchedDiv=document.getElementById("watchedList");
  const wishlistDiv=document.getElementById("wishlistList");
  watchedDiv.innerHTML=""; wishlistDiv.innerHTML="";
  let filtered = watched.filter(e=>{
    let match=true;
    if(timeFilter==="thisYear") match=match&&e.date&&new Date(e.date).getFullYear()===new Date().getFullYear();
    if(timeFilter==="lastMonth"){ let today=new Date(); let lastMonth=new Date(today.getFullYear(),today.getMonth()-1); let d=new Date(e.date); match=match&&d.getMonth()===lastMonth.getMonth()&&d.getFullYear()===lastMonth.getFullYear();}
    if(genreFilter&&genreFilter!=="all") match=match&&e.genre.toLowerCase()===genreFilter;
    if(typeFilter&&typeFilter!=="all") match=match&&e.type.toLowerCase()===typeFilter;
    return match;
  });
  filtered.forEach((e,i)=>{
    watchedDiv.innerHTML+=`<div class="card"><input type="checkbox" data-index="${i}"><div class="card-content"><strong>${e.title}</strong><br>Type: ${e.type}<br>Genre: ${e.genre}<br>Rating: ${e.rating}/10<br>Date: ${e.date}<br>Notes: ${e.notes}</div><button class="delete-btn" onclick="deleteWatched(${i})">×</button></div>`;
  });
  wishlist.forEach((e,i)=>{
    wishlistDiv.innerHTML+=`<div class="card"><input type="checkbox" data-index="${i}"><div class="card-content"><strong>${e.title}</strong><br>Type: ${e.type}<br>Genre: ${e.genre}<br>Rating: ${e.rating}/10<br>Date: ${e.date}<br>Notes: ${e.notes}</div><button class="move-btn" onclick="moveToWatched(${i})">→</button><button class="delete-btn" onclick="deleteWishlist(${i})">×</button></div>`;
  });
}
render();
</script>
</div>
</body>
</html>

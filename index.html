<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CineNova Tracker Pro</title>
<style>
:root {
  --primary: #3b82f6;
  --success: #10b981;
  --danger: #ef4444;
  --bg: #0f172a;
  --card-bg: #1e293b;
  --text: #f8fafc;
  --text-dim: #94a3b8;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding-bottom: 50px;
}

.container {
  max-width: 500px;
  margin: auto;
  padding: 16px;
}

h2 { font-size: 1.25rem; margin: 24px 0 12px; display: flex; align-items: center; gap: 8px; }

/* Input Group */
.form-group {
  background: var(--card-bg);
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
  margin-bottom: 20px;
}

input, select, textarea {
  width: 100%;
  font-size: 16px;
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
  border: 1px solid #334155;
  background: #0f172a;
  color: #fff;
  box-sizing: border-box;
}

.btn-row { display: flex; gap: 10px; margin-top: 10px; }
button {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: none;
  font-weight: 600;
  font-size: 14px;
  transition: transform 0.1s;
  color: white;
}
button:active { transform: scale(0.98); }

.btn-primary { background: var(--primary); }
.btn-success { background: var(--success); }
.btn-danger { background: var(--danger); }
.btn-outline { background: transparent; border: 1px solid var(--text-dim); color: var(--text-dim); }

/* Control Bar (Sort & Filter) */
.controls {
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
  padding: 10px 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

/* List Cards */
.card {
  background: var(--card-bg);
  margin-bottom: 12px;
  padding: 16px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid #334155;
}

.checkbox-wrapper {
  display: flex;
  align-items: center;
}

input[type="checkbox"] {
  width: 22px;
  height: 22px;
  accent-color: var(--primary);
}

.card-content { flex: 1; }
.card-content strong { font-size: 1.1rem; display: block; margin-bottom: 4px; }
.card-content small { color: var(--text-dim); display: block; margin-top: 2px; }

.rating-tag {
  background: #fbbf24;
  color: #000;
  padding: 2px 8px;
  border-radius: 6px;
  font-weight: bold;
  font-size: 12px;
  margin-left: 8px;
}

.type-tag {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  background: #475569;
  padding: 2px 6px;
  border-radius: 4px;
}

.card-actions { display: flex; flex-direction: column; gap: 8px; }
.mini-btn { padding: 8px; border-radius: 8px; font-size: 12px; width: 40px;}

</style>
</head>
<body>

<div class="container">
  <h1 style="text-align: center; color: var(--primary);">CineNova Tracker</h1>

  <div class="form-group">
    <input id="title" placeholder="Title (e.g. Inception)">
    <div style="display:flex; gap:8px;">
      <select id="type">
        <option>Movie</option>
        <option>Series</option>
        <option>Book</option>
      </select>
      <select id="genre">
        <option value="">Genre</option>
        <option>Action</option><option>Drama</option><option>Comedy</option>
        <option>Sci-Fi</option><option>Horror</option><option>Fantasy</option>
        <option>Documentary</option><option>Crime</option>
      </select>
    </div>
    <div style="display:flex; gap:8px;">
      <input id="rating" type="number" placeholder="Rating 1-10">
      <input id="date" type="date">
    </div>
    <textarea id="notes" placeholder="Personal notes..."></textarea>
    <div class="btn-row">
      <button class="btn-primary" onclick="addItem('watched')">+ Watched</button>
      <button class="btn-success" onclick="addItem('wishlist')">+ Wishlist</button>
    </div>
  </div>

  <div class="controls">
    <select onchange="applyFilters('type', this.value)">
      <option value="all">All Types</option>
      <option>Movie</option><option>Series</option><option>Book</option>
    </select>
    <select id="sortSelect" onchange="applySort(this.value)">
      <option value="date">Newest Date</option>
      <option value="alpha">A-Z Title</option>
      <option value="rating">Highest Rating</option>
      <option value="type">By Type</option>
      <option value="genre">By Genre</option>
    </select>
  </div>

  <div class="btn-row" style="margin-bottom: 20px;">
    <button class="btn-danger" style="padding: 10px;" onclick="deleteBulk()">Delete Selected Items</button>
  </div>

  <h2>🎬 Watched</h2>
  <div id="watchedList"></div>

  <h2>📌 Wishlist</h2>
  <div id="wishlistList"></div>
</div>

<script>
let data = {
  watched: JSON.parse(localStorage.getItem("watched")) || [],
  wishlist: JSON.parse(localStorage.getItem("wishlist")) || []
};

let currentFilters = { type: 'all' };

function save() {
  localStorage.setItem("watched", JSON.stringify(data.watched));
  localStorage.setItem("wishlist", JSON.stringify(data.wishlist));
}

function addItem(list) {
  const titleVal = document.getElementById('title').value;
  if(!titleVal) return alert("Please enter a title");
  
  const item = {
    id: Date.now(), // Unique ID for better tracking
    title: titleVal,
    type: document.getElementById('type').value,
    genre: document.getElementById('genre').value || 'Other',
    rating: document.getElementById('rating').value || '0',
    date: document.getElementById('date').value || new Date().toISOString().split('T')[0],
    notes: document.getElementById('notes').value
  };

  data[list].unshift(item);
  save();
  render();
  // Clear form
  ['title', 'rating', 'date', 'notes'].forEach(id => document.getElementById(id).value = "");
}

function deleteSingle(list, id) {
  if(confirm("Remove this item?")) {
    data[list] = data[list].filter(item => item.id !== id);
    save();
    render();
  }
}

function moveWishToWatched(id) {
  const idx = data.wishlist.findIndex(item => item.id === id);
  const item = data.wishlist.splice(idx, 1)[0];
  data.watched.unshift(item);
  save();
  render();
}

function deleteBulk() {
  const checked = document.querySelectorAll('input[type="checkbox"]:checked');
  if(checked.length === 0) return alert("Select items first");
  
  if(confirm(`Delete ${checked.length} items?`)) {
    checked.forEach(cb => {
      const id = parseInt(cb.value);
      data.watched = data.watched.filter(i => i.id !== id);
      data.wishlist = data.wishlist.filter(i => i.id !== id);
    });
    save();
    render();
  }
}

function applySort(criteria) {
  const sorter = (a, b) => {
    if(criteria === 'date') return new Date(b.date) - new Date(a.date);
    if(criteria === 'rating') return b.rating - a.rating;
    if(criteria === 'alpha') return a.title.localeCompare(b.title);
    if(criteria === 'type') return a.type.localeCompare(b.type);
    if(criteria === 'genre') return a.genre.localeCompare(b.genre);
  };
  data.watched.sort(sorter);
  data.wishlist.sort(sorter);
  render();
}

function applyFilters(key, val) {
  currentFilters[key] = val;
  render();
}

function render() {
  ['watched', 'wishlist'].forEach(listName => {
    const container = document.getElementById(`${listName}List`);
    container.innerHTML = "";
    
    let filtered = data[listName].filter(item => {
      return currentFilters.type === 'all' || item.type === currentFilters.type;
    });

    filtered.forEach(item => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="checkbox-wrapper">
          <input type="checkbox" value="${item.id}">
        </div>
        <div class="card-content">
          <span class="type-tag">${item.type}</span>
          <strong>${item.title} ${item.rating ? `<span class="rating-tag">★ ${item.rating}</span>` : ''}</strong>
          <small>${item.genre} • ${item.date}</small>
          ${item.notes ? `<small style="font-style:italic; color:#64748b; margin-top:5px;">"${item.notes}"</small>` : ''}
        </div>
        <div class="card-actions">
          <button class="btn-danger mini-btn" onclick="deleteSingle('${listName}', ${item.id})">✕</button>
          ${listName === 'wishlist' ? `<button class="btn-success mini-btn" onclick="moveWishToWatched(${item.id})">✓</button>` : ''}
        </div>
      `;
      container.appendChild(card);
    });
  });
}

// Initial Render
render();
</script>

</body>
</html>

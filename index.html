<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CineNova Tracker Elite</title>
<style>
:root {
  --primary: #3b82f6;
  --success: #10b981;
  --danger: #ef4444;
  --bg: #0f172a;
  --card-bg: #1e293b;
  --text: #f8fafc;
  --text-dim: #94a3b8;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding-bottom: 80px;
}

.container { max-width: 500px; margin: auto; padding: 16px; }

/* Input Section */
.form-group {
  background: var(--card-bg);
  padding: 18px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
  margin-bottom: 20px;
}

input, select, textarea {
  width: 100%; font-size: 16px; padding: 12px; margin: 6px 0;
  border-radius: 10px; border: 1px solid #334155;
  background: #0f172a; color: #fff; box-sizing: border-box;
}

.btn-row { display: flex; gap: 8px; margin-top: 10px; }
button {
  flex: 1; padding: 14px; border-radius: 12px; border: none;
  font-weight: 700; cursor: pointer; color: white; transition: 0.2s;
}
.btn-primary { background: var(--primary); }
.btn-success { background: var(--success); }
.btn-danger { background: var(--danger); width: 100%; margin-top: 10px;}

/* Filter/Sort Section */
.filter-panel {
  background: #1e293b80;
  padding: 15px;
  border-radius: 15px;
  margin-bottom: 20px;
  border: 1px dashed #475569;
}

.filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Card UI */
.card {
  background: var(--card-bg);
  margin-bottom: 12px;
  padding: 15px;
  border-radius: 16px;
  display: flex;
  gap: 12px;
  border-left: 5px solid var(--primary);
  position: relative;
}

.card.wishlist-border { border-left-color: var(--success); }

.checkbox-col { display: flex; align-items: flex-start; padding-top: 4px; }
input[type="checkbox"] { width: 20px; height: 20px; }

.card-info { flex: 1; }
.card-info h3 { margin: 0; font-size: 1.1rem; }
.tags { display: flex; gap: 5px; margin: 5px 0; flex-wrap: wrap; }
.tag { font-size: 10px; background: #334155; padding: 2px 8px; border-radius: 4px; text-transform: uppercase; }
.rating-pill { background: #fbbf24; color: #000; font-weight: bold; padding: 2px 6px; border-radius: 5px; font-size: 11px; }

.card-actions { display: flex; flex-direction: column; gap: 5px; }
.action-btn { width: 35px; height: 35px; border-radius: 8px; font-size: 18px; line-height: 1; }

h2 { border-bottom: 1px solid #334155; padding-bottom: 10px; margin-top: 30px; }
</style>
</head>
<body>

<div class="container">
  <h1 style="text-align:center; margin: 10px 0;">CineNova <span style="color:var(--primary)">Tracker</span></h1>

  <div class="form-group">
    <input id="title" placeholder="Title">
    <div class="filter-grid">
      <select id="type">
        <option>Movie</option>
        <option>Series</option>
        <option>Book</option>
      </select>
      <select id="genre">
        <option value="">Genre</option>
        <option>Action</option><option>Drama</option><option>Comedy</option>
        <option>Romance</option><option>Thriller</option><option>Sci-Fi</option>
        <option>Horror</option><option>Mystery</option><option>Superhero</option>
        <option>Spy</option><option>FamilyDrama</option><option>Fantasy</option>
        <option>Animation</option><option>Cartoon</option><option>Documentary</option>
        <option>Biography</option><option>Travel</option><option>Musical</option>
        <option>Crime</option><option>RealityShow</option><option>GameShow</option>
        <option>TalkShow</option>
      </select>
    </div>
    <div class="filter-grid">
      <input id="rating" type="number" placeholder="Rating (1-10)">
      <input id="date" type="date">
    </div>
    <textarea id="notes" placeholder="Notes..."></textarea>
    <div class="btn-row">
      <button class="btn-primary" onclick="addItem('watched')">+ Watched</button>
      <button class="btn-success" onclick="addItem('wishlist')">+ Wishlist</button>
    </div>
  </div>

  <div class="filter-panel">
    <div style="font-weight:bold; font-size: 12px; color:var(--text-dim); margin-bottom:8px;">COMPOUND FILTERS & SORTING</div>
    <div class="filter-grid">
      <select id="fType" onchange="render()">
        <option value="all">All Types</option>
        <option>Movie</option><option>Series</option><option>Book</option>
      </select>
      <select id="fGenre" onchange="render()">
        <option value="all">All Genres</option>
        <option>Action</option><option>Drama</option><option>Comedy</option><option>Romance</option><option>Thriller</option><option>Sci-Fi</option><option>Horror</option><option>Mystery</option><option>Superhero</option><option>Spy</option><option>FamilyDrama</option><option>Fantasy</option><option>Animation</option><option>Cartoon</option><option>Documentary</option><option>Biography</option><option>Travel</option><option>Musical</option><option>Crime</option><option>RealityShow</option><option>GameShow</option><option>TalkShow</option>
      </select>
      <select id="fTime" onchange="render()">
        <option value="all">All Time</option>
        <option value="thisYear">This Year</option>
        <option value="thisMonth">This Month</option>
      </select>
      <select id="fSort" onchange="render()">
        <option value="newest">Newest Date</option>
        <option value="oldest">Oldest Date</option>
        <option value="alpha">A-Z Title</option>
        <option value="rating">Top Rated</option>
      </select>
    </div>
    <button class="btn-danger" onclick="deleteBulk()">Delete Selected</button>
  </div>

  <h2>🍿 Watched</h2>
  <div id="watchedList"></div>

  <h2>📝 Wishlist</h2>
  <div id="wishlistList"></div>
</div>

<script>
let data = {
  watched: JSON.parse(localStorage.getItem("watched_v2")) || [],
  wishlist: JSON.parse(localStorage.getItem("wishlist_v2")) || []
};

function save() {
  localStorage.setItem("watched_v2", JSON.stringify(data.watched));
  localStorage.setItem("wishlist_v2", JSON.stringify(data.wishlist));
}

function addItem(list) {
  const title = document.getElementById('title').value;
  if(!title) return alert("Enter a title");
  
  const item = {
    id: Date.now(),
    title: title,
    type: document.getElementById('type').value,
    genre: document.getElementById('genre').value || 'Other',
    rating: document.getElementById('rating').value || 0,
    date: document.getElementById('date').value || new Date().toISOString().split('T')[0],
    notes: document.getElementById('notes').value
  };

  data[list].push(item);
  save(); render();
  document.getElementById('title').value = "";
}

function deleteSingle(list, id) {
  if(confirm("Remove this?")) {
    data[list] = data[list].filter(i => i.id !== id);
    save(); render();
  }
}

function moveToWatched(id) {
  const idx = data.wishlist.findIndex(i => i.id === id);
  const item = data.wishlist.splice(idx, 1)[0];
  data.watched.push(item);
  save(); render();
}

function deleteBulk() {
  const checked = document.querySelectorAll('input[type="checkbox"]:checked');
  if(checked.length === 0) return alert("Select items first");
  if(confirm(`Delete ${checked.length} items?`)) {
    checked.forEach(cb => {
      const id = parseInt(cb.value);
      data.watched = data.watched.filter(i => i.id !== id);
      data.wishlist = data.wishlist.filter(i => i.id !== id);
    });
    save(); render();
  }
}

function getFilteredList(listName) {
  const fType = document.getElementById('fType').value;
  const fGenre = document.getElementById('fGenre').value;
  const fTime = document.getElementById('fTime').value;
  const fSort = document.getElementById('fSort').value;

  let filtered = data[listName].filter(item => {
    let match = true;
    if(fType !== 'all' && item.type !== fType) match = false;
    if(fGenre !== 'all' && item.genre !== fGenre) match = false;
    
    if(fTime === 'thisYear') {
      match = match && new Date(item.date).getFullYear() === new Date().getFullYear();
    }
    if(fTime === 'thisMonth') {
      const d = new Date(item.date);
      const now = new Date();
      match = match && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    }
    return match;
  });

  // Apply Sorting
  filtered.sort((a, b) => {
    if(fSort === 'newest') return new Date(b.date) - new Date(a.date);
    if(fSort === 'oldest') return new Date(a.date) - new Date(b.date);
    if(fSort === 'alpha') return a.title.localeCompare(b.title);
    if(fSort === 'rating') return b.rating - a.rating;
    return 0;
  });

  return filtered;
}

function render() {
  ['watched', 'wishlist'].forEach(list => {
    const listDiv = document.getElementById(`${list}List`);
    listDiv.innerHTML = "";
    const items = getFilteredList(list);

    items.forEach(item => {
      const card = document.createElement('div');
      card.className = `card ${list === 'wishlist' ? 'wishlist-border' : ''}`;
      card.innerHTML = `
        <div class="checkbox-col">
          <input type="checkbox" value="${item.id}">
        </div>
        <div class="card-info">
          <h3>${item.title}</h3>
          <div class="tags">
            <span class="tag">${item.type}</span>
            <span class="tag">${item.genre}</span>
            ${item.rating > 0 ? `<span class="rating-pill">★ ${item.rating}</span>` : ''}
          </div>
          <div style="font-size:12px; color:var(--text-dim)">${item.date}</div>
          ${item.notes ? `<div style="font-size:12px; margin-top:5px; opacity:0.8">${item.notes}</div>` : ''}
        </div>
        <div class="card-actions">
          <button class="btn-danger action-btn" onclick="deleteSingle('${list}', ${item.id})">×</button>
          ${list === 'wishlist' ? `<button class="btn-success action-btn" onclick="moveToWatched(${item.id})">✓</button>` : ''}
        </div>
      `;
      listDiv.appendChild(card);
    });
  });
}

render();
</script>
</body>
</html>
